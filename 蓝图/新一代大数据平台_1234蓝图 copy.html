<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新一代大数据平台 · 1234 架构蓝图（整合·可编辑）</title>
<style>
  :root{
    --ink:#222a31; --ink2:#566069; --muted:#8a929b;
    --line:#e4e8ec;
    --blue-bg:#e9f2fc; --blue-bd:#1f63a8; --blue-tx:#0c447c;
    --app-bg:#f5f5f2; --app-bd:#dedcd5; --app-tx:#5f5e5a;
    --mod-bg:#ffffff; --mod-bd:#aecae9;
    --base-bg:#f1efe8; --base-bd:#dedcd5;
    --page:#f9fafb; --accent:#1f63a8; --accent-soft:#e9f2fc;
    --r:12px; --shadow:0 1px 2px rgba(20,40,60,.05),0 6px 20px rgba(20,40,60,.07);
    --shadow-h:0 2px 6px rgba(20,40,60,.08),0 16px 40px rgba(31,99,168,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;
    color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px 64px}
  .toolbar{position:sticky;top:0;z-index:10;background:rgba(249,250,251,.94);backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .tb-btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .tb-btn:hover{border-color:var(--accent);color:var(--accent)}
  .tb-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tb-sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .tb-note{flex-basis:100%;font-size:12px;color:var(--muted)}
  .crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
  .crumb{cursor:pointer;padding:4px 9px;border-radius:8px;transition:.18s;white-space:nowrap}
  .crumb:hover{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
  .crumb.cur{color:var(--ink);font-weight:600;cursor:default}
  .crumb.cur:hover{background:none;box-shadow:none}
  .sep{color:var(--line)}
  .view{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .h-title{text-align:center;font-size:24px;font-weight:700}
  .h-mnemo{text-align:center;color:var(--ink2);font-size:14px;margin-top:6px}
  .h-tag{text-align:center;font-size:13.5px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-top:8px;margin-bottom:6px}
  .h-hint{text-align:center;font-size:12.5px;color:var(--accent);background:var(--accent-soft);border:1px solid #cfe0f3;display:inline-block;padding:5px 13px;border-radius:999px;margin:14px auto 0}
  .hint-row{text-align:center;margin-bottom:20px}
  .frame{border:1px solid #d6dee6;border-radius:18px;padding:16px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .tier{position:relative;border-radius:var(--r);transition:.2s;cursor:pointer}
  .tier:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
  .tier::after{content:"展开 →";position:absolute;top:8px;right:12px;font-size:11px;font-weight:700;color:var(--accent);opacity:0;transition:.2s}
  .tier:hover::after{opacity:1}
  .badge{position:absolute;top:-10px;left:-10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(31,99,168,.35);z-index:3}
  .toprow{display:flex;gap:10px;padding:4px}
  .dbox{flex:1;border:1px solid var(--app-bd);background:var(--app-bg);border-radius:10px;padding:11px 8px;text-align:center}
  .dt{font-size:14px;font-weight:600;color:var(--app-tx)}
  .dsum{font-size:11.5px;font-weight:500;color:var(--app-tx);opacity:.7;margin-top:2px}
  .dsub{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:500;color:var(--blue-tx);background:#fff;border:1px solid var(--mod-bd);border-radius:8px;padding:6px 12px;line-height:1.45}
  .mid{display:flex;gap:10px;align-items:stretch}
  .pillar{width:86px;flex:none;border:1px solid var(--blue-bd);background:var(--blue-bg);border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:5px;position:relative;cursor:pointer;transition:.2s}
  .pillar:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
  .pillar .pc{font-size:17px;font-weight:600;color:var(--blue-tx);writing-mode:vertical-rl;letter-spacing:6px}
  .pcsub{writing-mode:vertical-rl;font-size:11px;font-weight:500;color:var(--blue-tx);opacity:.62;letter-spacing:1px}
  .bands{flex:1;display:flex;flex-direction:column;gap:10px;position:relative}
  .band{border:1px solid var(--blue-bd);background:var(--blue-bg);border-radius:var(--r);padding:9px 12px}
  .bt{font-size:14px;font-weight:600;color:var(--blue-tx);text-align:center;margin-bottom:2px}
  .bsub{font-size:11.5px;color:var(--blue-tx);opacity:.66;text-align:center;margin-bottom:8px}
  .mods{display:flex;align-items:center;gap:8px}
  .mod{flex:1;border:1px solid var(--mod-bd);background:var(--mod-bg);border-radius:8px;padding:11px 6px;text-align:center;font-size:13px;color:var(--ink)}
  .plus{font-size:17px;color:var(--blue-bd);flex:none}
  .base{border:1px solid var(--base-bd);background:var(--base-bg);border-radius:var(--r);padding:14px;text-align:center;font-size:15px;font-weight:600;color:var(--ink2);position:relative}
  .base-main{font-size:15px;font-weight:600}
  .basesub{font-size:12px;font-weight:500;color:var(--muted);margin-top:5px;letter-spacing:.5px}
  .num-strip{display:flex;justify-content:center;gap:18px;margin-top:18px;flex-wrap:wrap}
  .ns{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
  .ns b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;align-items:center;justify-content:center}
  .d-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .d-num{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .d-title{font-size:22px;font-weight:700}
  .d-ess{color:var(--ink2);font-size:14.5px;margin:4px 0 16px;padding-left:60px}
  .sec-h{font-size:15px;font-weight:700;color:var(--accent);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .sec-h::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
  .cards{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .card.hi{border-color:#bcd5f0;background:#fbfdff}
  .c-name{font-size:16px;font-weight:700;color:var(--ink)}
  .c-tag{display:inline-block;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:1px solid #cfe0f3;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .c-pts{margin:11px 0 0;padding:0;list-style:none}
  .c-pts li{position:relative;padding-left:18px;font-size:13.5px;color:var(--ink2);margin:6px 0}
  .c-pts li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .cmp{display:flex;gap:10px;margin-top:12px;font-size:12.5px;flex-wrap:wrap}
  .cmp .old,.cmp .new{flex:1;min-width:160px;border-radius:9px;padding:8px 11px;line-height:1.5}
  .cmp .old{background:#f4f5f6;color:#6b7178}
  .cmp .new{background:var(--accent-soft);color:var(--blue-tx);border:1px solid #cfe0f3}
  .cmp .lab{font-weight:700;font-size:11px;display:block;margin-bottom:2px;opacity:.8}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);cursor:pointer;margin-top:24px}
  .back:hover{text-decoration:underline}
  .ver-old{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:#fbfbfa;overflow:hidden}
  .ver-old>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;user-select:none}
  .ver-old>summary::-webkit-details-marker{display:none}
  .ver-old>summary::before{content:"▸";color:var(--accent);font-weight:800;transition:transform .2s}
  .ver-old[open]>summary::before{transform:rotate(90deg)}
  .ver-old>summary:hover{color:var(--accent)}
  .ver-old-body{padding:2px 16px 16px}
  /* engine module blocks (layer 2 - d3) */
  .eng{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .eng-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .eng-name{font-size:16px;font-weight:700;color:var(--ink)}
  .eng-tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:1px solid #cfe0f3;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .eng-intro{font-size:13px;color:var(--ink2);margin:6px 0 6px;line-height:1.65}
  .grp{margin-top:12px}
  .grp-h{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .grp-h::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none}
  .grp-mods{display:flex;flex-wrap:wrap;gap:8px}
  .grp-mods.vert{flex-direction:column;align-items:stretch}
  .mbox{border:1px solid var(--mod-bd);background:var(--blue-bg);color:var(--blue-tx);border-radius:8px;padding:9px 13px;font-size:13px;font-weight:500;text-align:center}
  .mbox.hot{background:#fff3e3;border-color:#e8943a;color:#a9620f}
  .grp-row{display:flex;gap:12px;flex-wrap:wrap}
  .grp.col{flex:1;min-width:170px;background:#f7fafd;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:12px}
  .eng-foot{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:9px}
  .pptflow{display:flex;align-items:stretch;gap:6px;margin-top:12px;flex-wrap:wrap}
  .pcol{flex:1;min-width:180px;background:#f7fafd;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
  .pcol-h{font-size:13.5px;font-weight:700;color:var(--blue-tx);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .pcol-h::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue-bd);flex:none}
  .pcol-body{display:flex;flex-direction:column;gap:8px;flex:1}
  .pcol-body.center{justify-content:center}
  .ppill{background:var(--blue-bg);border:1px solid var(--mod-bd);border-radius:8px;padding:9px 8px;text-align:center;font-size:13px;color:var(--blue-tx);font-weight:500}
  .pmol{background:#fff3e3;border:1px solid #e8943a;border-radius:10px;padding:16px 10px;text-align:center;font-size:13.5px;color:#a9620f;font-weight:600}
  .pcyl-row{display:flex;gap:8px}
  .pcyl{flex:1;position:relative;background:#dfeaf8;border:1px solid #9cc0e8;border-radius:9px;padding:15px 4px 9px;text-align:center;font-size:11.5px;color:var(--blue-tx);font-weight:500;line-height:1.3}
  .pcyl::before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:58%;height:6px;border:1px solid #9cc0e8;border-radius:50%;background:#eef4fc}
  .pwide{margin-top:8px;background:var(--blue-bd);border:1px solid var(--blue-bd);border-radius:9px;padding:11px 8px;text-align:center;font-size:13px;color:#fff;font-weight:600}
  .parrow{display:flex;align-items:center;font-size:22px;color:var(--blue-bd);font-weight:700;flex:none}
  @media(max-width:720px){.parrow{transform:rotate(90deg)}.pcol{min-width:180px}}
  .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .fbox{border:1px solid var(--mod-bd);background:#fff;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink);text-align:center}
  .fbox.fstart{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-tx);font-weight:600}
  .frow-lab{font-size:12px;color:var(--accent);font-weight:600;margin:10px 0 2px}
  .sandbox{border:1.5px solid var(--blue-bd);border-radius:12px;padding:13px;background:#f7fafd;margin:12px 0}
  .sandbox-h{font-size:14px;font-weight:700;color:var(--blue-tx);text-align:center;margin-bottom:10px}
  .sandbox-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
  .toolwrap{display:flex;flex-direction:column;gap:6px}
  .pcyl-lg{min-width:96px;padding:16px 10px 10px;font-size:12.5px}
  .lk-go{font-size:11px;color:var(--accent);font-weight:700;margin-left:8px;white-space:nowrap}
  .card.lk{cursor:pointer}
  .card.lk:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:#bcd5f0}
  .actors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
  .actor{border:1px solid var(--mod-bd);background:#fff;border-radius:8px;padding:8px 16px;font-size:13px;color:var(--ink);font-weight:500}
  .cloud{background:#efeefb;border:1px solid #cfcbf3;border-radius:22px;padding:16px 18px;margin:6px 0}
  .cloud-h{text-align:center;font-weight:700;color:#4a3fa6;font-size:14px;margin-bottom:12px}
  .cloud-body{display:flex;align-items:stretch;gap:10px;justify-content:center;flex-wrap:wrap}
  .cloud-side{display:flex;align-items:center;justify-content:center;min-width:108px;font-weight:600}
  .cloud-caps,.cloud-data{display:flex;flex-direction:column;gap:7px}
  .orgs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .org{border:1px solid #9cc0e8;background:#eaf2fb;border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--blue-tx);font-weight:500}
  .edit{transition:background .15s}
  body.editing .edit{outline:1px dashed #a9c1de;border-radius:3px;padding:0 2px;cursor:text;background:rgba(31,99,168,.05)}
  body.editing .edit:focus{outline:1.5px solid var(--accent);background:#fff}
  body.editing .tier,body.editing .pillar{cursor:default}
  body.editing .tier:hover,body.editing .pillar:hover{transform:none;box-shadow:var(--shadow)}
  body.editing .tier::after{display:none}
  @media(max-width:720px){.g2{grid-template-columns:1fr}.toprow{flex-wrap:wrap}.dbox{min-width:45%}.grp.col{min-width:100%}}
  /* ===== 2026–2030 建设进度时间轴 ===== */
  .yr-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 8px}
  .yr-bar-h{font-size:13px;font-weight:700;color:var(--ink2)}
  .yr-chip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--mod-bd);background:#fff;color:var(--blue-tx);padding:6px 15px;border-radius:999px;cursor:pointer;transition:.18s}
  .yr-chip:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .yr-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(31,99,168,.3)}
  .yr-play,.yr-reset{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .yr-play:hover,.yr-reset:hover{border-color:var(--accent);color:var(--accent)}
  .yr-legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}
  .yr-legend .lg{display:inline-flex;align-items:center;gap:6px}
  .yr-legend .lg::before{content:"";width:13px;height:13px;border-radius:4px;border:1px solid;flex:none}
  .yr-legend .lg-new::before{background:#fff3e3;border-color:#e8943a}
  .yr-legend .lg-done::before{background:#e9f7ef;border-color:#3a9d63}
  .yr-cap{text-align:center;font-size:12.5px;color:#a9620f;background:#fff8ee;border:1px solid #f0d8b5;border-radius:8px;padding:7px 12px;margin:0 auto 14px;max-width:780px}
  .yr-cap:empty{display:none}
  .hl-done{border-color:#3a9d63 !important;background:#e9f7ef !important;box-shadow:inset 0 0 0 1px #3a9d63,0 2px 8px rgba(58,157,99,.16) !important}
  .hl-done .dt,.hl-done .dsum,.hl-done .dsub,.hl-done .pc,.hl-done .bt,.hl-done .base-main{color:#1f6b40 !important}
  .hl-new{border-color:#e8943a !important;background:#fff3e3 !important;box-shadow:inset 0 0 0 1px #e8943a,0 2px 8px rgba(232,148,58,.18) !important}
  .hl-new .dt,.hl-new .dsum,.hl-new .dsub,.hl-new .pc,.hl-new .bt,.hl-new .base-main{color:#a9620f !important}
  .hlp{position:relative}
  .pct-bar{position:absolute;left:8px;right:8px;bottom:5px;height:4px;border-radius:3px;background:rgba(40,50,60,.10);z-index:2}
  .pct-bar>i{display:block;height:100%;border-radius:3px;background:#e8943a;transition:width .55s ease}
  .hl-done .pct-bar>i{background:#3a9d63}
  .pct-badge{position:absolute;top:4px;right:5px;font-size:10px;font-weight:800;line-height:1;padding:2px 5px;border-radius:7px;background:#fff;border:1px solid #e8943a;color:#a9620f;z-index:2}
  .hl-done .pct-badge{border-color:#3a9d63;color:#1f6b40}
  .hl-new.hl-pulse{animation:pulseAmber 1.15s ease-in-out infinite}
  .hl-done.hl-pulse{animation:pulseGreen 1.15s ease-in-out infinite}
  @keyframes pulseAmber{0%,100%{box-shadow:inset 0 0 0 1px #e8943a,0 0 0 3px rgba(232,148,58,.16)}50%{box-shadow:inset 0 0 0 1px #e8943a,0 0 0 9px rgba(232,148,58,.32)}}
  @keyframes pulseGreen{0%,100%{box-shadow:inset 0 0 0 1px #3a9d63,0 0 0 3px rgba(58,157,99,.16)}50%{box-shadow:inset 0 0 0 1px #3a9d63,0 0 0 9px rgba(58,157,99,.34)}}
  .yr-play.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rm-editor{border:1px dashed var(--accent);background:#fbfdff;border-radius:12px;padding:13px 16px;margin:0 auto 14px;max-width:820px}
  .rm-h{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:10px}
  .rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px 18px}
  .rm-grp-h{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:7px;border-top:1px solid var(--line);padding-top:7px}
  .rm-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .rm-name{font-size:12.5px;color:var(--ink)}
  .rm-in{width:62px;font:inherit;font-size:12.5px;text-align:right;border:1px solid var(--mod-bd);border-radius:6px;padding:3px 7px;color:var(--ink)}
  .rm-in:focus{outline:1.5px solid var(--accent)}
  .rm-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <button class="tb-btn" id="btnEdit" onclick="toggleEdit()">✎ 编辑文字：关</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" onclick="nav('home')">首页</button>
    <button class="tb-btn" onclick="nav('d1')">①</button>
    <button class="tb-btn" onclick="nav('d2')">②</button>
    <button class="tb-btn" onclick="nav('d3')">③</button>
    <button class="tb-btn" onclick="nav('d4')">④</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" onclick="downloadEdited()">⬇ 下载编辑版</button>
    <button class="tb-btn" onclick="resetData()">↺ 恢复初始</button>
    <span class="tb-note">打开「编辑文字」后点任意文字即可修改；用 ①②③④ 切换页面编辑各层；改完点「下载编辑版」保存为新的 HTML。</span>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div id="stage"></div>
</div>

<script id="seed" type="application/json">
{

<script>
const KEY="bp1234_v8";

let cur="home", editMode=false;

function gp(o,p){return p.split('.').reduce((a,k)=>(a==null?a:a[k]),o);}
function sp(o,p,v){const ks=p.split('.');const last=ks.pop();let t=o;for(const k of ks)t=t[k];t[last]=v;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function E(path){return '<span class="edit" data-k="'+path+'">'+esc(gp(DATA,path))+'</span>';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch(e){}}

const TITLE={home:"新一代大数据平台 · 1234 架构",d1:"① 一个底座",d2:"② 两大支柱",d3:"③ 三大引擎",d4:"④ 四大场景",d4u:"Data for Users",d4o:"Data for Oper"};
const PARENT={d1:"home",d2:"home",d3:"home",d4:"home",d4u:"d4",d4o:"d4"};
function crumbs(){
  const path=[];let n=cur;while(n){path.unshift(n);n=PARENT[n];}
  document.getElementById("crumbs").innerHTML=path.map((id,i)=>{
    const last=i===path.length-1;
    return '<span class="crumb'+(last?' cur':'')+'"'+(last?'':' onclick="nav(\''+id+'\')"')+'>'+TITLE[id]+'</span>';
  }).join('<span class="sep">›</span>');
}

}

function renderCards(sections,pfx){
  let body='';
  sections.forEach((s,si)=>{
    if(s.h) body+='<div class="sec-h">'+E(pfx+'.sections.'+si+'.h')+'</div>';
    body+='<div class="cards'+(s.g2?' g2':'')+'">';
    s.cards.forEach((c,ci)=>{
      const base=pfx+'.sections.'+si+'.cards.'+ci;
      let pts=(c.pts&&c.pts.length)?'<ul class="c-pts">'+c.pts.map((p,pi)=>'<li>'+E(base+'.pts.'+pi)+'</li>').join('')+'</ul>':'';
      let tag=(c.tag!==undefined&&c.tag!=='')?'<span class="c-tag">'+E(base+'.tag')+'</span>':'';
      let cmp=(c.old!==undefined)?'<div class="cmp"><div class="old"><span class="lab">传统 / Hadoop</span>'+E(base+'.old')+'</div><div class="new"><span class="lab">新一代</span>'+E(base+'.nw')+'</div></div>':'';
      let lk=c.link?'<span class="lk-go" onclick="event.stopPropagation();nav(\''+c.link+'\')">展开 →</span>':'';
      let oc=c.link?(' onclick="go(\''+c.link+'\')"'):'';
      body+='<div class="card'+(c.hi?' hi':'')+(c.link?' lk':'')+'"'+oc+'><div><span class="c-name">'+E(base+'.name')+'</span>'+tag+lk+'</div>'+pts+cmp+'</div>';
    });
    body+='</div>';
  });
  return body;
}
function V_detail(id){
  const d=gp(DATA,'details.'+id);
  let body=renderCards(d.sections,'details.'+id);
  let arch='';
  if(d.archives&&d.archives.length){
    d.archives.forEach((a,ai)=>{
      const ap='details.'+id+'.archives.'+ai;
      arch+='<details class="ver-old"><summary>'+E(ap+'.label')+'</summary><div class="ver-old-body">'+renderCards(a.sections,ap)+'</div></details>';
    });
  }
  return '<div class="view"><div class="d-head"><div class="d-num">'+id.slice(1)+'</div><div class="d-title">'+E('details.'+id+'.title')+'</div></div>'+
    '<div class="d-ess">'+E('details.'+id+'.ess')+'</div>'+body+arch+
    '<div class="back" onclick="nav(\'home\')">← 返回第一层蓝图</div></div>';
}

function V_d3(){
  const d=DATA.details.d3;
  let blocks='';
  d.blocks.forEach((b,bi)=>{
    const bp='details.d3.blocks.'+bi;
    let wrap;
    if(b.cols){
      const g0=bp+'.groups.0',g1=bp+'.groups.1',g2=bp+'.groups.2';
      const pills=b.groups[0].mods.map((m,mi)=>`<div class="ppill">${E(g0+'.mods.'+mi)}</div>`).join('');
      const mol=`<div class="pmol">${E(g1+'.mods.0')}</div>`;
      const sm=b.groups[2].mods;
      const cyls=sm.slice(0,-1).map((m,mi)=>`<div class="pcyl">${E(g2+'.mods.'+mi)}</div>`).join('');
      const wide=`<div class="pwide">${E(g2+'.mods.'+(sm.length-1))}</div>`;
      let extra='';
      for(let gi=3;gi<b.groups.length;gi++){
        const gpth=bp+'.groups.'+gi, g=b.groups[gi];
        const ms=g.mods.map((m,mi)=>`<div class="mbox${g.hot?' hot':''}">${E(gpth+'.mods.'+mi)}</div>`).join('');
        extra+=`<div class="grp"><div class="grp-h">${E(gpth+'.gh')}</div><div class="grp-mods">${ms}</div></div>`;
      }
      wrap='<div class="pptflow">'
        +'<div class="pcol"><div class="pcol-h">'+E(g0+'.gh')+'</div><div class="pcol-body">'+pills+'</div></div>'
        +'<div class="parrow">→</div>'
        +'<div class="pcol"><div class="pcol-h">'+E(g1+'.gh')+'</div><div class="pcol-body center">'+mol+'</div></div>'
        +'<div class="parrow">→</div>'
        +'<div class="pcol"><div class="pcol-h">'+E(g2+'.gh')+'</div><div class="pcol-body"><div class="pcyl-row">'+cyls+'</div>'+wide+'</div></div>'
        +'</div>'+extra;
    }else{
      let groups='';
      b.groups.forEach((g,gi)=>{
        const gpth=bp+'.groups.'+gi;
        const mods=g.mods.map((m,mi)=>`<div class="mbox${g.hot?' hot':''}">${E(gpth+'.mods.'+mi)}</div>`).join('');
        groups+=`<div class="grp"><div class="grp-h">${E(gpth+'.gh')}</div><div class="grp-mods">${mods}</div></div>`;
      });
      wrap=groups;
    }
    const intro=b.intro?`<div class="eng-intro">${E(bp+'.intro')}</div>`:'';
    const foot=b.foot?`<div class="eng-foot">${E(bp+'.foot')}</div>`:'';
    const cmp=(b.old!==undefined)?`<div class="cmp"><div class="old"><span class="lab">传统数据平台</span>${E(bp+'.old')}</div><div class="new"><span class="lab">新一代</span>${E(bp+'.nw')}</div></div>`:'';
    const tag=b.tag?`<span class="eng-tag">${E(bp+'.tag')}</span>`:'';
    blocks+=`<div class="eng"><div class="eng-h"><span class="eng-name">${E(bp+'.name')}</span>${tag}</div>${intro}${wrap}${cmp}${foot}</div>`;
  });
  return '<div class="view"><div class="d-head"><div class="d-num">3</div><div class="d-title">'+E('details.d3.title')+'</div></div>'+
    '<div class="d-ess">'+E('details.d3.ess')+'</div>'+blocks+
    '<div class="back" onclick="nav(\'home\')">← 返回第一层蓝图</div></div>';
}

function subhead(bp){return '<div class="d-head"><div class="d-num">④</div><div class="d-title">'+E(bp+'.title')+'</div></div><div class="d-ess">'+E(bp+'.ess')+'</div>';}
function V_d4u(){
  const d=DATA.details.d4u,bp='details.d4u';
  const fl=(steps,base)=>steps.map((s,i)=>'<div class="fbox">'+E(base+'.'+i)+'</div>').join('<span class="parrow">→</span>');
  const tools=d.sandbox.tools.map((t,i)=>'<div class="mbox">'+E(bp+'.sandbox.tools.'+i)+'</div>').join('');
  return '<div class="view">'+subhead(bp)+
    '<div class="flow"><div class="fbox fstart">'+E(bp+'.start')+'</div></div>'+
    '<div class="frow-lab">'+E(bp+'.pathA.lab')+'</div><div class="flow">'+fl(d.pathA.steps,bp+'.pathA.steps')+'</div>'+
    '<div class="frow-lab">'+E(bp+'.pathB.lab')+'</div><div class="flow">'+fl(d.pathB.steps,bp+'.pathB.steps')+'</div>'+
    '<div class="sandbox"><div class="sandbox-h">'+E(bp+'.sandbox.title')+'</div><div class="sandbox-row">'+
      '<div class="pcyl pcyl-lg">'+E(bp+'.sandbox.cyl_in')+'</div><span class="parrow">→</span>'+
      '<div class="toolwrap">'+tools+'</div><span class="parrow">→</span>'+
      '<div class="pcyl pcyl-lg">'+E(bp+'.sandbox.cyl_out')+'</div></div></div>'+
    '<div class="flow">'+fl(d.tail,bp+'.tail')+'</div>'+
    '<div class="back" onclick="nav(\'d4\')">← 返回四大场景</div></div>';
}
function V_d4o(){
  const d=DATA.details.d4o,bp='details.d4o';
  const users=d.users.map((u,i)=>'<div class="actor">'+E(bp+'.users.'+i)+'</div>').join('');
  const caps=d.space.caps.map((c,i)=>'<div class="mbox">'+E(bp+'.space.caps.'+i)+'</div>').join('');
  const data=d.space.data.map((c,i)=>'<div class="pcyl pcyl-lg">'+E(bp+'.space.data.'+i)+'</div>').join('');
  const orgs=d.orgs.map((o,i)=>'<div class="org">'+E(bp+'.orgs.'+i)+'</div>').join('');
  return '<div class="view">'+subhead(bp)+
    '<div class="frow-lab" style="text-align:center">↓ 提出数据需求 / 获取交付</div>'+

    '<div class="cloud"><div class="cloud-h">'+E(bp+'.space.name')+'</div><div class="cloud-body">'+
      '<div class="mbox cloud-side">'+E(bp+'.space.left')+'</div>'+
      '<div class="cloud-caps">'+caps+'</div>'+
      '<div class="cloud-data">'+data+'</div>'+
      '<div class="mbox cloud-side">'+E(bp+'.space.right')+'</div></div></div>'+
    '<div class="frow-lab" style="text-align:center">↑ 节点注册接入（原始数据不出域）</div>'+
    '<div class="orgs">'+orgs+'</div>'+
    '<div class="back" onclick="nav(\'d4\')">← 返回四大场景</div></div>';
}
const VIEWS={home:V_home,d1:()=>V_detail('d1'),d2:()=>V_detail('d2'),d3:V_d3,d4:()=>V_detail('d4'),d4u:V_d4u,d4o:V_d4o};

// ===== 2026–2030 建设进度交互 =====
const YEARS=[2026,2027,2028,2029,2030];
let hlYear=null, playTimer=null, editProgress=false;
function nameOf(id){
  if(id==='base')return DATA.base;
  let m;
  if(id.indexOf('sc')===0)return DATA.scenarios[+id.slice(2)].t;
  if(id.indexOf('pil')===0)return DATA.pillars[+id.slice(3)];
  if((m=id.match(/^b(\d+)m(\d+)$/)))return DATA.bands[+m[1]].mods[+m[2]];
  if((m=id.match(/^band(\d+)$/)))return DATA.bands[+m[1]].bt;
  return id;
}
function roadmapIds(){const a=[];DATA.scenarios.forEach((s,i)=>a.push('sc'+i));DATA.pillars.forEach((p,i)=>a.push('pil'+i));DATA.bands.forEach((b,i)=>{a.push('band'+i);b.mods.forEach((m,j)=>a.push('b'+i+'m'+j));});a.push('base');return a;}
function resolveMap(raw){if(raw==="ALL"){const m={};roadmapIds().forEach(id=>m[id]=100);return m;}return raw||{};}
function clearHL(){
  document.querySelectorAll('[data-hl]').forEach(e=>e.classList.remove('hl-new','hl-done','hlp','hl-pulse'));
  document.querySelectorAll('.pct-bar,.pct-badge').forEach(e=>e.remove());
}
function markPct(id,pct,changed){
  const v=Math.max(0,Math.min(100,pct));
  document.querySelectorAll('[data-hl="'+id+'"]').forEach(e=>{
    e.classList.add('hlp', v>=100?'hl-done':'hl-new');
    if(changed)e.classList.add('hl-pulse');
    if(v<100){
      const bar=document.createElement('span');bar.className='pct-bar';
      const fill=document.createElement('i');fill.style.width=v+'%';bar.appendChild(fill);
      const badge=document.createElement('span');badge.className='pct-badge';badge.textContent=v+'%';
      e.appendChild(bar);e.appendChild(badge);
    }
  });
}
function applyHighlight(){
  clearHL();
  document.querySelectorAll('.yr-chip').forEach(c=>c.classList.toggle('on',+c.dataset.yr===hlYear));
  const cap=document.getElementById('yrCap');
  if(!hlYear){if(cap)cap.textContent='';return;}
  const raw=DATA.roadmap[hlYear];
  const isAll=(raw==="ALL");
  const map=resolveMap(raw);
  const idx=YEARS.indexOf(hlYear);
  const prevMap=resolveMap(idx>0?DATA.roadmap[YEARS[idx-1]]:{});
  const entries=Object.entries(map).filter(e=>e[1]>0);
  entries.forEach(e=>markPct(e[0],e[1],(prevMap[e[0]]||0)!==e[1]));
  if(cap){
    if(isAll){cap.textContent='（2030 年）平台全部建成上线 · 各模块 100%';}
    else{
      const prog=entries.filter(e=>e[1]<100), done=entries.filter(e=>e[1]>=100);
      let s='（'+hlYear+' 年）';
      if(prog.length)s+='建设中 '+prog.map(e=>nameOf(e[0])+' '+e[1]+'%').join('、');
      if(prog.length&&done.length)s+='　｜　';
      if(done.length)s+='已完成 '+done.length+' 项（100%）';
      cap.textContent=s;
    }
  }
}
function syncEditor(){
  const btn=document.getElementById('rmBtn');
  if(btn){btn.textContent=editProgress?'✎ 编辑进度：开':'✎ 编辑进度';btn.classList.toggle('on',editProgress);}
  const box=document.getElementById('rmEditor');
  if(!box)return;
  if(!editProgress){box.innerHTML='';return;}
  if(!hlYear){box.innerHTML='<div class="rm-editor"><div class="rm-note">先点选上方某个年份，即可编辑该年各模块的建设比例（0–100；0 表示当年不高亮）。</div></div>';return;}
  if(DATA.roadmap[hlYear]==="ALL"){const m={};roadmapIds().forEach(id=>m[id]=100);DATA.roadmap[hlYear]=m;save();}
  const yr=DATA.roadmap[hlYear];
  const sections=[{h:'四大场景',ids:DATA.scenarios.map((s,i)=>'sc'+i)},{h:'两大支柱',ids:DATA.pillars.map((p,i)=>'pil'+i)}];
  DATA.bands.forEach((b,i)=>sections.push({h:b.bt,ids:['band'+i].concat(b.mods.map((m,j)=>'b'+i+'m'+j))}));
  sections.push({h:'底座',ids:['base']});
  let rows='';
  sections.forEach(sec=>{
    rows+='<div class="rm-grp-h">'+esc(sec.h)+'</div>';
    sec.ids.forEach(id=>{
      let nm=esc(nameOf(id));if(/^band\d+$/.test(id))nm+='（整带）';
      const val=(yr[id]==null?0:yr[id]);
      rows+='<div class="rm-row"><span class="rm-name">'+nm+'</span><input class="rm-in" type="number" min="0" max="100" step="10" value="'+val+'" data-id="'+id+'"></div>';
    });
  });
  box.innerHTML='<div class="rm-editor"><div class="rm-h">编辑 '+hlYear+' 年建设比例</div><div class="rm-grid">'+rows+'</div><div class="rm-note">数值＝该模块在 '+hlYear+' 年的累计完成度：100＝整块标绿（无标签）；1–99＝橙色进度条；0＝不高亮。比上一年有变化的模块会闪烁。改完点「下载编辑版」即可保存。</div></div>';
}
function refresh(){applyHighlight();syncEditor();}
function toggleRoadmapEdit(){editProgress=!editProgress;syncEditor();}
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;const b=document.getElementById('yrPlay');if(b)b.textContent='▶ 自动播放';}}
function selectYear(y){stopPlay();hlYear=(hlYear===y?null:y);refresh();}
function clearYear(){stopPlay();hlYear=null;refresh();}
function playYears(){
  const btn=document.getElementById('yrPlay');
  if(playTimer){stopPlay();return;}
  let i=0;hlYear=YEARS[0];refresh();if(btn)btn.textContent='⏸ 暂停';
  playTimer=setInterval(()=>{i++;if(i>=YEARS.length){stopPlay();return;}hlYear=YEARS[i];refresh();},1200);
}
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('rm-in')&&hlYear){let v=parseInt(t.value,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(100,v));if(typeof DATA.roadmap[hlYear]!=='object'||!DATA.roadmap[hlYear])DATA.roadmap[hlYear]={};DATA.roadmap[hlYear][t.dataset.id]=v;save();applyHighlight();}});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('rm-in')&&hlYear){let v=parseInt(t.value,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(100,v));t.value=v;DATA.roadmap[hlYear][t.dataset.id]=v;save();applyHighlight();}});
function applyCE(){document.querySelectorAll('.edit').forEach(e=>e.setAttribute('contenteditable',editMode?'true':'false'));}
function render(){crumbs();document.getElementById('stage').innerHTML=VIEWS[cur]();applyCE();if(cur==='home')refresh();}
function nav(id){stopPlay();cur=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function go(id){if(editMode)return;nav(id);}
function toggleEdit(){
  editMode=!editMode;
  document.body.classList.toggle('editing',editMode);
  const be=document.getElementById('btnEdit');
  be.textContent=editMode?'✎ 编辑文字：开':'✎ 编辑文字：关';
  be.classList.toggle('on',editMode);
  applyCE();
}
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('edit')&&t.isContentEditable){sp(DATA,t.dataset.k,t.innerText);save();}});
document.addEventListener('keydown',e=>{const t=e.target;if(t.classList&&t.classList.contains('edit')&&e.key==='Enter'){e.preventDefault();t.blur();}});
function resetData(){if(!confirm('恢复到文件打开时的初始文字？已编辑内容将丢失。'))return;try{localStorage.removeItem(KEY);}catch(e){}DATA=JSON.parse(document.getElementById('seed').textContent);render();}
function downloadEdited(){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#seed').textContent=JSON.stringify(DATA,null,1);
  const b=clone.querySelector('body'); if(b)b.classList.remove('editing');
  const be=clone.querySelector('#btnEdit'); if(be){be.textContent='✎ 编辑文字：关';be.classList.remove('on');}
  const html='<!DOCTYPE html>\n'+clone.outerHTML;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='新一代大数据平台_1234蓝图_已编辑.html';
  document.body.appendChild(a);a.click();a.remove();
}
render();
</script>
