[project]
name = "workforce-designer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cron-descriptor>=1.4.5",
    "cronexpr>=0.30.0",
    "dash>=3.0.4",
    "dash-bootstrap-components>=2.0.2",
    "dash-cytoscape>=1.0.2",
    "flask-caching>=2.3.1",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "temporalio>=1.11.0",
    "litellm",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "apscheduler>=3.10.0",
    "azure-storage-blob>=12.26.0",
    "pyautogen==0.10.0",
    "autogen-agentchat>=0.7.4",
    "autogen[openai]>=0.9.9",
    "networkx>=3.4.2",
    "beautifulsoup4>=4.14.3",
    "selenium>=4.39.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "dist", ".venv"]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "I"] 
ignore = ["E501"]
